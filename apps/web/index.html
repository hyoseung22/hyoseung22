<!doctype html>
<html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Game Agent Orchestrator V1</title>
<style>body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;margin:0}header{padding:16px 20px;border-bottom:1px solid #334155;display:flex;justify-content:space-between}main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:12px}h2{margin:0 0 10px;font-size:16px}ul{padding-left:18px;margin:8px 0}input,select,textarea,button{width:100%;margin:4px 0;padding:8px;border-radius:8px;border:1px solid #475569;background:#0b1220;color:#e2e8f0}button{cursor:pointer;background:#1d4ed8;border:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pill{display:inline-block;font-size:12px;border:1px solid #64748b;padding:2px 6px;border-radius:999px;margin-left:6px}</style></head>
<body><header><strong>Game Agent Orchestrator V1 (Local)</strong><span id="health">checking...</span></header>
<main>
<section class="card"><h2>에이전트 생성</h2><input id="agentName" placeholder="name" /><div class="row"><select id="agentRole"><option>lead</option><option>senior</option><option>junior</option><option>intern</option></select><select id="agentProvider"><option>claude</option><option>codex</option><option>gemini</option><option>opencode</option><option>copilot</option><option>antigravity</option></select></div><select id="agentDept"></select><input id="agentSpec" placeholder='specialties comma separated' /><button id="createAgentBtn">Create Agent</button><h2 style="margin-top:14px;">에이전트 목록</h2><ul id="agents"></ul></section>
<section class="card"><h2>태스크 생성</h2><input id="taskTitle" placeholder="task title" /><textarea id="taskAc" placeholder="acceptance criteria"></textarea><button id="createTaskBtn">Create Task</button><h2 style="margin-top:14px;">태스크 목록</h2><ul id="tasks"></ul></section>
<section class="card"><h2>메시지</h2><textarea id="messageText" placeholder="공지/지시 내용을 입력"></textarea><button id="sendMessageBtn">Send Message</button><ul id="messages"></ul></section>
<section class="card"><h2>감사 로그</h2><ul id="audit"></ul></section>
</main><script src="/app.js"></script></body></html>
