<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bloom Isles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap">
<style>
  :root { color-scheme: light; --sea: #8ed5d2; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--sea); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<canvas id="c" aria-label="Bloom Isles island garden game"></canvas>
<script>
(() => {
'use strict';

/* ================================================================
   Bloom Isles: grow the liveliest island before the rival islands do.
   Everything is drawn on one canvas; the only text is the title.
   ================================================================ */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

const TAU = Math.PI * 2, SQ3 = Math.sqrt(3), SQ = 0.74, HS = 30;
const rand = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pick = a => a[(rand() * a.length) | 0];

/* ---------- palette ---------- */
const INK = '#4a3a3f';
const C = {
  sea: '#8ed5d2', seaDeep: '#76c3c6', wave: '#b9e9e2', shallow: 'rgba(196,240,228,.6)', foam: 'rgba(255,255,248,.8)',
  sand: '#f5e0a6', grassDry: '#cadb8a', grassLush: '#79c261', meadDry: '#dde6a0', meadLush: '#9fd86b',
  pond: '#86cde6', pondHi: '#b3e3f2', cliff: '#e0b183', cliff2: '#b88664', rock: '#bdb6ae',
  paper: '#fff6e4', paper2: '#f1dfbf', good: '#6cc26a', mid: '#f4c64e', bad: '#e96b5f', plum: '#5d4a6e'
};
const TEAM = [
  { c: '#ff8f7d', d: '#d65f4e' },
  { c: '#72a9f5', d: '#4a7fcc' },
  { c: '#ffc94f', d: '#cf9719' },
  { c: '#b893ea', d: '#8a63c2' }
];
const SEA = 0, SAND = 1, GRASS = 2, MEAD = 3, POND = 4, ROCK = 5;

/* ---------- hex geometry (pointy top, squashed for a tabletop view) ---------- */
const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
const EDGE_DIR = [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]];
const HEXV = [...Array(6)].map((_, i) => { const a = Math.PI / 180 * (60 * i - 30); return [Math.cos(a), Math.sin(a) * SQ]; });
const key = (q, r) => q + ',' + r;
const hdist = (a, b) => (Math.abs(a.q - b.q) + Math.abs(a.r - b.r) + Math.abs(a.q + a.r - b.q - b.r)) / 2;
const hx = (q, r) => HS * SQ3 * (q + r / 2);
const hy = (q, r) => HS * 1.5 * r * SQ;
function hexPath(c, x, y, r) { c.beginPath(); for (let i = 0; i < 6; i++) { const p = HEXV[i]; i ? c.lineTo(x + p[0] * r, y + p[1] * r) : c.moveTo(x + p[0] * r, y + p[1] * r); } c.closePath(); }

/* ---------- species: who likes whom ----------
   needs: [species, radius, weight, cap]  (negative weight = dislikes) */
const SP = {
  flower:   { k: 'p', terr: [GRASS, MEAD], base: .45, tb: { [MEAD]: .1 }, needs: [['bee', 2, .22, 2], ['flower', 1, .06, 2], ['rabbit', 1, -.08, 3]], head: 24 },
  bush:     { k: 'p', terr: [GRASS, MEAD], base: .45, needs: [['bird', 2, .2, 2], ['bee', 2, .1, 1], ['rabbit', 1, -.06, 3]], head: 24 },
  tree:     { k: 'p', terr: [GRASS, MEAD], base: .45, tb: { [GRASS]: .05 }, needs: [['bird', 1, .15, 2], ['mushroom', 1, .15, 2], ['tree', 1, .05, 2]], head: 48 },
  palm:     { k: 'p', terr: [SAND], base: .5, needs: [['crab', 1, .25, 2], ['palm', 1, .04, 2]], head: 40 },
  lily:     { k: 'p', terr: [POND], base: .45, needs: [['frog', 1, .3, 2], ['lily', 1, .05, 2]], head: 10 },
  mushroom: { k: 'p', terr: [GRASS, MEAD], base: .2, needs: [['tree', 1, .35, 2], ['frog', 2, .05, 1]], head: 20 },
  bee:      { k: 'a', terr: [GRASS, MEAD, SAND], base: .3, needs: [['flower', 1, .15, 4], ['bush', 1, .08, 2], ['frog', 1, -.15, 2]], head: 34 },
  rabbit:   { k: 'a', terr: [GRASS, MEAD], base: .35, needs: [['bush', 1, .15, 2], ['flower', 1, .08, 2], ['tree', 1, .05, 1], ['fox', 2, -.3, 3]], head: 32 },
  fox:      { k: 'a', terr: [GRASS, MEAD], base: .25, needs: [['rabbit', 2, .18, 3], ['tree', 1, .08, 2], ['fox', 2, -.15, 3]], head: 30 },
  bird:     { k: 'a', terr: [GRASS, MEAD, SAND], base: .3, needs: [['tree', 1, .18, 3], ['bush', 1, .1, 2], ['palm', 1, .1, 2], ['fox', 1, -.1, 2]], head: 22 },
  frog:     { k: 'a', terr: [POND], base: .3, needs: [['lily', 1, .2, 2], ['bee', 2, .12, 2], ['frog', 1, -.05, 3]], head: 18 },
  crab:     { k: 'a', terr: [SAND], base: .35, needs: [['palm', 1, .25, 2], ['crab', 1, .05, 1], ['bird', 1, -.1, 2]], head: 16 }
};
const NATURE = Object.keys(SP);
// thriving creatures slowly bring new life
const SPAWN = {
  bee: { sp: ['flower'], rad: 1, p: .55 }, bird: { sp: ['bush', 'tree'], rad: 2, p: .4 }, frog: { sp: ['lily'], rad: 1, p: .5 },
  tree: { sp: ['mushroom'], rad: 1, p: .3 }, rabbit: { sp: ['rabbit'], rad: 1, p: .2, pair: true }, crab: { sp: ['crab'], rad: 1, p: .18 },
  flower: { sp: ['flower'], rad: 1, p: .14 }, palm: { sp: ['palm'], rad: 1, p: .15 }
};
const THRIVE = .72, SAD = .32;
const stateOf = h => h >= THRIVE ? 2 : h >= SAD ? 1 : 0;
function needW(a, b, d) { for (const n of SP[a].needs) if (n[0] === b && d <= n[1]) return n[2]; return 0; }

/* ---------- tuning ---------- */
const DUR = 300, GOAL = 200, CARD_CD = 3.6, STORM_T = 7, SHIELD_T = 25, WITHER_T = 16;
const DIFF = [
  { cd: 1.5, think: 1.7, miss: .5, react: 2.6, tap: .9, aggr: .22, noise: 2.4, bias: .8 },
  { cd: 1.12, think: 1.2, miss: .28, react: 1.7, tap: .6, aggr: .36, noise: 1.1, bias: 1.1 },
  { cd: .9, think: .85, miss: .1, react: 1.05, tap: .42, aggr: .5, noise: .45, bias: 1.3 }
];

/* ================================================================
   Island generation
   ================================================================ */
function genIsland(seed) {
  for (let attempt = 0; attempt < 30; attempt++) {
    const isl = tryGen(seed + attempt * 7919);
    if (isl) return isl;
  }
  return tryGen(seed, true);
}
function tryGen(seed, force) {
  const R = rng(seed), RAD = 6;
  const bumps = [];
  for (let i = 0; i < 8; i++) bumps.push({ x: (R() - .5) * 330, y: (R() - .5) * 330, r: 50 + R() * 90, a: (R() - .38) * .9 });
  const mead = [];
  for (let i = 0; i < 5; i++) mead.push({ x: (R() - .5) * 300, y: (R() - .5) * 300, r: 50 + R() * 70 });
  const raw = new Map();
  for (let q = -RAD - 1; q <= RAD + 1; q++) for (let r = -RAD - 1; r <= RAD + 1; r++) {
    const d = hdist({ q, r }, { q: 0, r: 0 });
    if (d > RAD) continue;
    const x = hx(q, r), y = HS * 1.5 * r;
    let v = 1 - Math.pow(d / RAD, 2) * 1.05;
    for (const b of bumps) v += b.a * Math.exp(-((x - b.x) ** 2 + (y - b.y) ** 2) / (b.r * b.r));
    v += (R() - .5) * .16;
    if (v > .28 || d === 0 || force && d < 4) raw.set(key(q, r), { q, r });
  }
  // keep the piece connected to the center
  const land = new Map(), stack = [raw.get('0,0')];
  while (stack.length) {
    const t = stack.pop(); const k = key(t.q, t.r);
    if (land.has(k)) continue; land.set(k, t);
    for (const [dq, dr] of DIRS) { const n = raw.get(key(t.q + dq, t.r + dr)); if (n && !land.has(key(n.q, n.r))) stack.push(n); }
  }
  if (!force && (land.size < 62 || land.size > 112)) return null;

  const tiles = new Map(), list = [];
  for (const t of land.values()) {
    const tile = { q: t.q, r: t.r, x: hx(t.q, t.r), y: hy(t.q, t.r), t: GRASS, ent: null, deco: [], shade: R(), n1: [], n2: [] };
    tiles.set(key(t.q, t.r), tile); list.push(tile);
  }
  const edge = [];
  for (const t of list) {
    let coast = false;
    for (const [dq, dr] of DIRS) if (!tiles.has(key(t.q + dq, t.r + dr))) coast = true;
    if (coast) { t.t = SAND; edge.push(t); }
    else {
      const X = t.x, Y = HS * 1.5 * t.r; let m = 0;
      for (const b of mead) m += Math.exp(-((X - b.x) ** 2 + (Y - b.y) ** 2) / (b.r * b.r));
      t.t = m > .45 ? MEAD : GRASS;
    }
  }
  // a few coastal tiles stay grassy so the beach isn't a perfect ring
  for (const t of edge) if (R() < .18) { const inner = DIRS.some(([dq, dr]) => { const n = tiles.get(key(t.q + dq, t.r + dr)); return n && n.t !== SAND; }); if (inner) t.t = GRASS; }
  const interior = list.filter(t => t.t !== SAND && DIRS.every(([dq, dr]) => { const n = tiles.get(key(t.q + dq, t.r + dr)); return n && n.t !== SAND; }));
  if (!force && interior.length < 8) return null;
  // ponds
  const pondCount = interior.length > 30 ? 2 : 1;
  for (let p = 0; p < pondCount; p++) {
    const c = interior[(R() * interior.length) | 0];
    if (c.t === POND) continue;
    c.t = POND; let grown = 0;
    const around = DIRS.map(([dq, dr]) => tiles.get(key(c.q + dq, c.r + dr))).filter(n => n && n.t !== SAND && n.t !== POND);
    around.sort(() => R() - .5);
    for (const n of around) { if (grown >= 2 + (R() * 2 | 0)) break; n.t = POND; grown++; }
  }
  // rocks
  const grassy = list.filter(t => t.t === GRASS || t.t === MEAD);
  for (let i = 0; i < 2 + (R() * 3 | 0); i++) { const t = grassy[(R() * grassy.length) | 0]; if (t && t.t !== POND) t.t = ROCK; }
  if (!force && list.filter(t => t.t === SAND).length < 8) return null;

  for (const t of list) {
    for (const u of list) { const d = hdist(t, u); if (d === 1) t.n1.push(u); if (d >= 1 && d <= 2) t.n2.push(u); }
    const n = t.t === GRASS ? 3 : t.t === MEAD ? 5 : t.t === SAND ? 2 : 0;
    for (let i = 0; i < n; i++) {
      const a = R() * TAU, rr = Math.sqrt(R()) * HS * .72;
      t.deco.push({ x: Math.cos(a) * rr, y: Math.sin(a) * rr * SQ, k: t.t === SAND ? (R() < .3 ? 'shell' : 'pebble') : (t.t === MEAD && i > 1 ? 'dot' : 'tuft'), c: pick(['#fff', '#ffe27a', '#ffb3c7']), s: .7 + R() * .6 });
    }
  }
  let bx0 = 1e9, bx1 = -1e9, by0 = 1e9, by1 = -1e9;
  for (const t of list) { bx0 = Math.min(bx0, t.x - HS); bx1 = Math.max(bx1, t.x + HS); by0 = Math.min(by0, t.y - HS); by1 = Math.max(by1, t.y + HS); }
  return { seed, tiles, land: list, edge, ents: [], threats: [], parts: [], score: 0, ds: 0, lush: 0, ver: 1, shield: 0, hitT: 0, hitBy: -1, recalcT: 0, b: { x0: bx0, x1: bx1, y0: by0, y1: by1 } };
}

/* ================================================================
   Ecology
   ================================================================ */
function happ(tile, sp, virt) {
  const d = SP[sp]; let h = d.base + (d.tb && d.tb[tile.t] || 0);
  for (const [s, rad, w, cap] of d.needs) {
    let n = 0; const L = rad === 1 ? tile.n1 : tile.n2;
    for (const t of L) { if (t.ent && t.ent.sp === s) n++; else if (virt && virt.tile === t && virt.sp === s) n++; }
    h += Math.min(n, cap) * w;
  }
  return clamp(h, 0, 1);
}
const entScore = (h, sp) => (h >= THRIVE ? 3 : h >= SAD ? 1.5 : .4) * (SP[sp].k === 'a' ? 1.25 : 1);
const canPlace = (isl, t, sp) => !!(t && SP[sp] && !t.ent && SP[sp].terr.includes(t.t) && !isl.threats.some(th => th.k === 'storm' && !th.struck && !th.blown && hdist(th.tile, t) === 0));
function placeValue(isl, tile, sp) {
  let before = 0, after = 0;
  for (const t of tile.n2) if (t.ent) { before += entScore(happ(t, t.ent.sp), t.ent.sp); after += entScore(happ(t, t.ent.sp, { tile, sp }), t.ent.sp); }
  const h = happ(tile, sp);
  return { v: after - before + entScore(h, sp), h };
}
function recalc(isl) {
  let s = 0; const kinds = new Set();
  for (const e of isl.ents) {
    if (e.dying) continue;
    e.h = happ(e.tile, e.sp);
    s += entScore(e.h, e.sp);
    if (e.h >= THRIVE) kinds.add(e.sp);
  }
  isl.score = s + kinds.size * 3;
  isl.kinds = kinds.size;
}
let UID = 0;
function addEnt(isl, tile, sp, natural) {
  const e = { id: ++UID, sp, tile, x: tile.x + (rand() - .5) * 5, y: tile.y + (rand() - .5) * 3, h: .5, hd: .5, sadT: 0, thrT: 0, next: 6 + rand() * 6, born: 0, dying: 0, v: (rand() * 4) | 0, ph: rand() * TAU };
  tile.ent = e; isl.ents.push(e); isl.ver++;
  recalc(isl); e.hd = e.h;
  burst(isl, e.x, e.y - 8, natural ? 'spark' : 'leaf', natural ? 4 : 8);
  return e;
}
function kill(isl, e, how) {
  if (e.dying) return;
  e.dying = .001; e.how = how;
  if (e.tile.ent === e) e.tile.ent = null;
  isl.ver++;
  burst(isl, e.x, e.y - 10, how === 'zap' ? 'soot' : how === 'wither' ? 'leafDead' : 'puff', 8);
  recalc(isl);
}
function trySpawn(isl, e) {
  const rule = SPAWN[e.sp]; if (!rule || rand() > rule.p) return;
  if (rule.pair && !e.tile.n1.some(t => t.ent && t.ent.sp === e.sp)) return;
  const sp = pick(rule.sp);
  const L = (rule.rad === 1 ? e.tile.n1 : e.tile.n2).filter(t => canPlace(isl, t, sp));
  if (!L.length) return;
  let best = null, bv = -1e9;
  for (const t of L) { const v = placeValue(isl, t, sp).v + rand() * 1.5; if (v > bv) { bv = v; best = t; } }
  if (best && bv > 0) { addEnt(isl, best, sp, true); if (islIndex(isl) === game.view) sfx('sprout'); }
}

/* ---------- particles (island space) ---------- */
function burst(isl, x, y, type, n) {
  for (let i = 0; i < n; i++) {
    const a = rand() * TAU, sp = 20 + rand() * 50;
    isl.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * .6 - 30, life: 0, max: .6 + rand() * .6, type, rot: rand() * TAU, c: type === 'leaf' ? pick(['#8fd070', '#6fbe5c', '#b6e37b']) : type === 'leafDead' ? pick(['#c9a46a', '#a88b5c']) : '#fff' });
  }
  if (isl.parts.length > 320) isl.parts.splice(0, isl.parts.length - 320);
}
function floatUp(isl, x, y, type) { isl.parts.push({ x, y, vx: (rand() - .5) * 10, vy: -26, life: 0, max: 1.4, type, rot: 0, c: '#fff' }); }

/* ================================================================
   Game state
   ================================================================ */
let scene = 'title', paused = false, diffIdx = 1, game = null, T = 0;
let titleIsl = null, titleSpin = 0;
let tut = { place: false, attack: false, defend: false };
try { const s = JSON.parse(localStorage.getItem('bloomIslesTut') || '{}'); Object.assign(tut, s); } catch (e) {}
try { const d = +localStorage.getItem('bloomIslesDiff'); if (d >= 0 && d <= 2) diffIdx = d; } catch (e) {}
function saveTut() { try { localStorage.setItem('bloomIslesTut', JSON.stringify(tut)); } catch (e) {} }
const islIndex = isl => game ? game.players.findIndex(p => p.isl === isl) : -1;

function newGame() {
  const players = [];
  for (let i = 0; i < 4; i++) {
    const isl = i === 0 ? resetIsl(titleIsl) : genIsland((rand() * 1e9) | 0);
    players.push({ i, isl, hand: [], bot: i > 0, think: 1.5 + rand() * 2, rr: 0 });
  }
  game = { players, t: 0, view: 0, sel: -1, shovel: false, fx: [], shake: 0, alert: 0, placed: 0, attacks: 0, defends: 0, inspect: null, hover: null, fade: 1, over: false, cache: null, ranks: null, endT: 0 };
  for (const p of players) for (let s = 0; s < 4; s++) p.hand.push({ c: drawCard(p, true), cd: 0, wig: 0, flip: 0 });
  scene = 'play'; paused = false;
  layout();
}
function resetIsl(isl) { for (const t of isl.land) t.ent = null; Object.assign(isl, { ents: [], parts: [], threats: [], score: 0, ds: 0, lush: 0, shield: 0, hitT: 0 }); isl.ver++; return isl; }
function seedTitle(isl) {
  for (const s of ['tree', 'bird', 'flower', 'bee', 'palm', 'crab', 'lily', 'frog', 'bush', 'flower', 'tree', 'rabbit']) {
    let best = null, bv = -1e9;
    for (const t of isl.land) if (canPlace(isl, t, s)) { const v = placeValue(isl, t, s).v + rand(); if (v > bv) { bv = v; best = t; } }
    if (best) addEnt(isl, best, s, true);
  }
  isl.parts = []; for (const e of isl.ents) { e.born = 1; e.hd = e.h; }
  isl.lush = clamp(isl.score / GOAL * 2.5, 0, .8);
  return isl;
}
function newTitleIsland() { titleIsl = seedTitle(genIsland((rand() * 1e9) | 0)); titleSpin = 0; }
function hasSpot(isl, sp) { return isl.land.some(t => canPlace(isl, t, sp)); }
function drawCard(p, first) {
  const r = rand();
  if (!first && game.t > 14) {
    if (r < .105) return rand() < .5 ? 'storm' : 'beetle';
    if (r < .145) return 'shield';
  }
  const bag = [];
  for (const sp of NATURE) {
    if (!hasSpot(p.isl, sp)) continue;
    let w = SP[sp].k === 'p' ? 1.15 : 1;
    if (first && (sp === 'fox' || sp === 'mushroom')) w *= .3;
    bag.push([sp, w]);
  }
  if (!bag.length) return rand() < .5 ? 'storm' : 'beetle';
  let tot = bag.reduce((a, b) => a + b[1], 0), x = rand() * tot;
  for (const [sp, w] of bag) { x -= w; if (x <= 0) return sp; }
  return bag[0][0];
}
const cardCD = p => CARD_CD * (p.bot ? DIFF[diffIdx].cd : 1);
function useSlot(p, si) { const s = p.hand[si]; s.c = null; s.cd = cardCD(p); s.flip = 0; }

function place(p, si, tile) {
  const s = p.hand[si], sp = s.c;
  if (!canPlace(p.isl, tile, sp)) return false;
  addEnt(p.isl, tile, sp, false);
  useSlot(p, si);
  if (!p.bot) { game.placed++; sfx('place'); if (!tut.place) { tut.place = true; saveTut(); } }
  else if (game.view === p.i) sfx('placeSoft');
  return true;
}
function attack(p, si, to, tile) {
  const type = p.hand[si].c; useSlot(p, si);
  game.fx.push({ k: 'fly', type, from: p.i, to, t: 0, dur: 1.15, tile });
  if (!p.bot) { game.attacks++; sfx('whoosh'); if (!tut.attack) { tut.attack = true; saveTut(); } }
  else if (to === 0) sfx('whoosh');
}
function useShield(p, si) {
  useSlot(p, si); p.isl.shield = SHIELD_T;
  burst(p.isl, (p.isl.b.x0 + p.isl.b.x1) / 2, (p.isl.b.y0 + p.isl.b.y1) / 2, 'spark', 16);
  for (const th of p.isl.threats) if (th.k === 'beetle' && !th.dead) th.leave = true;
  if (!p.bot || game.view === p.i) sfx('shield');
}
function arrive(f) {
  const isl = game.players[f.to].isl;
  isl.hitBy = f.from; isl.hitT = 3;
  if (isl.shield > 0) {
    burst(isl, (isl.b.x0 + isl.b.x1) / 2, isl.b.y0 - 10, 'spark', 14);
    if (f.to === 0 || game.view === f.to) sfx('bounce');
    return;
  }
  if (f.type === 'storm') {
    let tile = f.tile;
    if (!tile) { let best = -1; for (const t of isl.land) { let n = t.ent ? 1.2 : 0; for (const u of t.n1) if (u.ent) n++; n += rand() * .5; if (n > best) { best = n; tile = t; } } }
    isl.threats.push({ k: 'storm', tile, x: tile.x, y: tile.y, t: 0, taps: 0, need: 6, struck: false, blown: false, st: 0, sc: 1, cx: tile.x + 240, cy: tile.y - 190, from: f.from });
  } else {
    for (let i = 0; i < 3; i++) {
      const t = pick(isl.edge);

let endBtns = {};
function renderEnd() {

}

/* ================================================================
   Input
   ================================================================ */
const ptr = { x: 0, y: 0 };
let drag = null, hoverCard = -1, hoverBtn = null, hoverPortrait = -1;
const inCirc = (b, x, y, pad = 4) => b && Math.hypot(x - b.x, y - b.y) <= b.r + pad;

function cardAt(x, y) { for (let i = 0; i < 4; i++) { const r = L.cards[i]; if (inRect({ x: r.x, y: r.y - 16, w: r.w, h: r.h + 16 }, x, y)) return i; } return -1; }

function setView(i) { if (game.view !== i) { game.view = i; game.fade = .6; game.inspect = null; game.cache = null; sfx('click'); } }

function onDown(ev) {
  ensureAudio();

  cv.setPointerCapture && cv.setPointerCapture(ev.pointerId);

    if (inCirc(titleBtns.play, x, y)) { sfx('place'); newGame(); return; }
    if (inCirc(titleBtns.dice, x, y)) { newTitleIsland(); sfx('reroll'); return; }
    (titleBtns.diff || []).forEach((r, i) => { if (x > r.x - 12 && x < r.x + 52 && Math.abs(y - r.y) < 16) { diffIdx = i; try { localStorage.setItem('bloomIslesDiff', String(i)); } catch (e) {} sfx('click'); } });
    return;
  }
  if (scene === 'end') {
    if (game.endT > 1.2 && inCirc(endBtns.again, x, y)) { newTitleIsland(); newGame(); sfx('place'); return; }
    if (game.endT > 1.2 && inCirc(endBtns.home, x, y)) { newTitleIsland(); scene = 'title'; sfx('click'); }
    return;
  }
  if (paused) {
    if (Math.hypot(x - W / 2, y - H / 2) < 50) { paused = false; sfx('click'); }
    else if (Math.hypot(x - (W / 2 - 100), y - H / 2) < 30) { paused = false; newTitleIsland(); scene = 'title'; sfx('click'); }
    return;
  }
  if (inCirc(L.pause, x, y)) { paused = true; drag = null; sfx('click'); return; }
  const me = game.players[0];
  if (inCirc(L.reroll, x, y)) { if (me.rr <= 0) { for (const s of me.hand) if (s.c) { s.c = drawCard(me); s.flip = 0; } me.rr = 7; game.sel = -1; sfx('reroll'); } else sfx('nope'); return; }

  if (ci >= 0) {
    if (!me.hand[ci].c) { me.hand[ci].wig = 1; sfx('nope'); return; }
    game.shovel = false;
    const was = game.sel === ci;
    game.sel = ci; drag = { si: ci, sx: x, sy: y, moved: false, was }; if (!was) sfx('pick');
    const c = me.hand[ci].c;
    if (SP[c] && game.view !== 0) setView(0);

}
function portraitTap(pi) {
  const me = game.players[0], c = game.sel >= 0 ? me.hand[game.sel].c : null;
  if ((c === 'storm' || c === 'beetle') && pi !== 0) { attack(me, game.sel, pi, null); game.sel = -1; return; }

}

function onUp(ev) {

cv.addEventListener('pointerdown', e => { e.preventDefault(); onMove(e); onDown(e); });

cv.addEventListener('pointercancel', () => { drag = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (scene !== 'play') return;
  if (e.key === 'Escape') { if (game.sel >= 0 || game.shovel) { game.sel = -1; game.shovel = false; } else paused = !paused; }

/* ================================================================
   Boot
   ================================================================ */
function resize() {

addEventListener('resize', resize);
resize();
let last = performance.now();

requestAnimationFrame(frame);
