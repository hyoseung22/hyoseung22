naver:
  username_env: NAVER_ID
  password_env: NAVER_PW
  use_saved_session: true
  session_file: ./data/session.json

band:
  target_url: https://band.us/band/your-band-id
  post_text: |
    정기 공지입니다.
    오늘 일정은 10:00 회의 / 15:00 점검입니다.
  style:
    bold: true
    font_size: 16
    font_color: '#1F6FEB'

schedule:
  interval_minutes: 5
  timezone: Asia/Seoul
  active_time:
    start: '07:00'
    end: '19:00'

retry:
  max_attempts: 3
  backoff_seconds: 8

logging:
  level: INFO
  file: ./logs/app.log
